name: Dependency & Secret Audit

# 供应链与密钥扫描。每周一定时 + 手动触发 + push 触发。
# G-1（安全方案 §4）：自用分支 1password 长期驻留，定时任务只跑默认分支不等于
# 分支验证通过，push 也必须检查；生产依赖 high+ 为交付门禁——pnpm-audit 不再
# continue-on-error（main 在移植 smol-toml 定点升级前会在此项标红，属真实发现）。

on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  push:
    branches: [main, 1password]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-deny
      - name: Advisories (RustSec)
        working-directory: src-tauri
        run: cargo deny check advisories
      - name: Licenses & bans (report only)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo deny check licenses bans

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production dependencies only, high+ (G-1 交付门禁，不再静默放行)
        run: pnpm audit --audit-level=high --prod

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan full history (allowlist in .gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
