name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Check repository links
        run: node scripts/check-links.mjs

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows credential-manager and registry roundtrip
        # 计划 §9 Phase 2：真实凭据管理器 / HKCU\Environment 往返。这两个用例本体都在，
        # 但被 #[ignore] 挡在常规 cargo test 之外，此前从未在 CI 跑过。
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --exact secrets::store::tests::secrets_windows_roundtrip
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --exact env_delivery::sink::tests::env_sink_windows_roundtrip

      - name: Secret scan (test home)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testHome = Join-Path $env:TEMP "cc-switch-test-home"
          if (-not (Test-Path $testHome)) {
            # 之前这里先 New-Item 建空目录，于是"集成测试一个都没跑"也会静默通过。
            Write-Error "Test home $testHome does not exist; integration tests did not run"
            exit 1
          }
          & scripts/secret-scan.ps1 -Path $testHome
          if ($LASTEXITCODE -ne 0) {
            Write-Error "secret-scan detected plaintext fixtures in the test home"
            exit 1
          }

      - name: Secret scan (fixture literals outside the fixture home)
        # 夹具本身按设计含明文，所以豁免范围要覆盖"定义 / 消费夹具的地方"，其余任何位置
        # 出现夹具字面量都说明密钥被复制进了源码。
        #   src-tauri\tests                    —— 夹具 home、v18-plaintext.db、生成器与消费它的集成测试
        #   src-tauri\src\secrets\extractor.rs —— 该文件的 #[cfg(test)] 单测直接引用夹具字面量
        #   scripts\secret-scan.ps1            —— 字面量清单本身
        #   docs\plans                         —— 设计文档引用夹具字面量作说明（不是源码也不是产物）
        #   src-tauri\target / dist / node_modules / .git —— 构建产物与版本库，不是"源码"
        #   .workbuddy-ai                      —— 本地 AI 工作记录，被 .git/info/exclude 忽略、
        #                                         永远不会进 CI；列出来是为了让同一条命令在本地也能通过
        # 两点说明：
        # 1. src-tauri\target 里唯一会命中夹具字面量的是 Rust 测试二进制（字面量按设计编进去），
        #    而本 fork 的 target 目录本机就有 55 GB / 39064 个文件——扫它只有误报，没有信号。
        # 2. 原豁免清单只写了 fixtures\v18-home，漏了 v18-plaintext.db、fixture_v18.rs、
        #    migration_v18_cold_start.rs、extractor.rs、计划文档这 5 处，一旦跑到必然 FAIL。
        #    由于 concurrency 的 cancel-in-progress，这一步此前从未跑完过，问题一直被掩盖。
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/secret-scan.ps1 -Path . -Allow `
            "src-tauri\tests", `
            "src-tauri\src\secrets\extractor.rs", `
            "scripts\secret-scan.ps1", `
            "docs\plans", `
            "src-tauri\target", `
            "dist", `
            "node_modules", `
            ".workbuddy-ai", `
            ".git"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "secret-scan found fixture literals outside the fixture home"
            exit 1
          }

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Record the built test binary path so the run step below can execute
        # it directly instead of re-invoking cargo with TEMP on \\wsl.localhost.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinary = cargo test --lib --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test -and $artifact.target.name -eq 'cc_switch_lib') {
                  $artifact.executable
                }
              }
            } | Select-Object -First 1 -Wait
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testBinary) {
            throw "cc_switch_lib test binary not found in cargo compiler artifacts"
          }
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the test binary built in the previous step directly. Invoking cargo
        # here with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
