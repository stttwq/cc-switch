name: Release

# 正式产物由本地构建 + gh release 上传（见 docs/release-process-zh.md）。
# 这里保留一条手动触发的云端发布，只作为本地发布不可用时的补位手段。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v2.0.1-ab12cd3）
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  release:
    # D1：本方案只保证 Windows。原先 matrix 里只有 windows-2022，却留着 Linux 依赖安装、
    # Linux 构建、Linux 打包步骤，以及依赖从未定义的 `matrix.arch` 的 ARM64 分支——
    # 后者永远不会进入，但发布正文却承诺 -Windows-arm64.msi。这里全部收敛为 x86_64。
    runs-on: windows-2022
    environment: release

    steps:
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-f]+|-alpha|-beta|-rc(\.[0-9]+)?)?$ ]]; then
            echo "标签格式不合法: '${RELEASE_TAG}'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:RELEASE_TAG  # e.g., v2.0.1-ab12cd3
          if (-not $VERSION) { throw 'RELEASE_TAG 为空，无法命名产物' }
          $targetRoot = 'src-tauri/target/release'

          # 仅打包 MSI 安装器（自动更新已移除，不再产出 / 收集 .sig）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "CC-Switch-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
          } else {
            Write-Warning 'No Windows MSI installer found'
          }

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      # 版本号规则里短哈希后缀（v2.0.0-b7768a9）不算预发布，只有 alpha/beta/rc 才是
      - name: Decide prerelease flag
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ -(alpha|beta|rc)([.-][0-9]+)?$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 手动触发时 GITHUB_SHA 是分支头而非标签提交，必须显式指回标签，否则 Release 会链到错误的提交
          target_commitish: ${{ env.RELEASE_TAG }}
          name: CC Switch ${{ env.RELEASE_TAG }}
          prerelease: ${{ steps.precheck.outputs.prerelease }}
          body: |
            ## CC Switch ${{ env.RELEASE_TAG }}

            Claude Code、Codex 与 Pi 的供应商切换工具（Windows 专版）。

            ### 下载

            - **Windows (x86_64)**: `CC-Switch-${{ env.RELEASE_TAG }}-Windows.msi`
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
