name: Release

# 正式产物由本地构建 + gh release 上传（见 docs/release-process-zh.md）。
# 这里保留一条手动触发的云端发布，只作为本地发布不可用时的补位手段。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v2.0.1-ab12cd3）
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  release:
    # D1：本方案只保证 Windows。原先 matrix 里只有 windows-2022，却留着 Linux 依赖安装、
    # Linux 构建、Linux 打包步骤，以及依赖从未定义的 `matrix.arch` 的 ARM64 分支——
    # 后者永远不会进入，但发布正文却承诺 -Windows-arm64.msi。这里全部收敛为 x86_64。
    runs-on: windows-2022
    environment: release
    # DEL-A：构建 job 不需要写权限，签名材料在生产者之外完成
    permissions:
      contents: read

    steps:
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-f]+|-alpha|-beta|-rc(\.[0-9]+)?)?$ ]]; then
            echo "标签格式不合法: '${RELEASE_TAG}'" >&2
            exit 1
          fi

      # DEL-A：标签版本必须与 package.json 一致（短哈希/预发布后缀不参与比较）
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      # DEL-A：标签版本必须与 package.json 一致（短哈希/预发布后缀不参与比较）
      - name: Verify tag version matches package.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION_WITH_SUFFIX="${RELEASE_TAG#v}"
          BASE_VERSION="${VERSION_WITH_SUFFIX%%-*}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
            echo "标签版本 ($BASE_VERSION) 与 package.json 版本 ($PKG_VERSION) 不一致" >&2
            exit 1
          fi
          echo "版本一致性通过: $BASE_VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build

      # DEL-A：只接受精确命名的唯一产物，缺 MSI / 多候选都硬失败；
      # 最终资产名在计算校验和之前确定，避免「清单记构建名、用户下载改名文件」的错位
      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $TAG = $env:RELEASE_TAG
          if (-not $TAG) { throw 'RELEASE_TAG 为空，无法命名产物' }
          $TAG_VERSION = $TAG.Substring(1)
          $BASE_VERSION = ($TAG_VERSION -split '-')[0]
          $targetRoot = 'src-tauri/target/release'

          # 校验 MSI ProductVersion 与应用版本一致
          $expectedMsiName = "CC Switch_${BASE_VERSION}_x64_zh-CN.msi"
          $expectedMsi = Join-Path $targetRoot "bundle/msi/$expectedMsiName"
          if (-not (Test-Path $expectedMsi)) {
            throw "未找到预期 MSI 产物: $expectedMsiName（请检查构建输出与版本号）"
          }
          $msiCode = Get-Item $expectedMsi | ForEach-Object { $_.VersionInfo.ProductVersion }
          if ($msiCode -ne $BASE_VERSION) {
            throw "MSI ProductVersion ($msiCode) 与标签版本 ($BASE_VERSION) 不一致"
          }

          # 目录里出现其他 MSI 视为脏构建产物，一律拒绝（防止拿错文件）
          $allMsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi
          if ($allMsis.Count -ne 1) {
            throw "bundle 目录存在 $($allMsis.Count) 个 MSI，需要唯一产物；请清理后重新构建"
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $dest = "CC-Switch-$TAG-Windows.msi"
          Copy-Item $expectedMsi (Join-Path release-assets $dest)
          Write-Host "Installer copied: $dest (ProductVersion=$msiCode)"

      # DEL-A：对最终下载名生成校验清单（minisign 签名由维护者离线完成后补充）
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ls *.msi
          sha256sum CC-Switch-*.msi > SHA256SUMS
          cat SHA256SUMS

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    # DEL-A：写权限只给发布 job
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      # 版本号规则里短哈希后缀（v2.0.0-b7768a9）不算预发布，只有 alpha/beta/rc 才是
      - name: Decide prerelease flag
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ -(alpha|beta|rc)([.-][0-9]+)?$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 手动触发时 GITHUB_SHA 是分支头而非标签提交，必须显式指回标签，否则 Release 会链到错误的提交
          target_commitish: ${{ env.RELEASE_TAG }}
          name: CC Switch ${{ env.RELEASE_TAG }}
          prerelease: ${{ steps.precheck.outputs.prerelease }}
          # DEL-A：云端补位只产出草稿——缺 minisign 签名的资产集不允许直接正式发布。
          # 维护者对 SHA256SUMS 离线签名并上传 SHA256SUMS.minisig、核对附件后再手动发布。
          draft: true
          body: |
            ## CC Switch ${{ env.RELEASE_TAG }}

            Claude Code、Codex 与 Pi 的供应商切换工具（Windows 专版）。

            ### 下载

            - **Windows (x86_64)**: `CC-Switch-${{ env.RELEASE_TAG }}-Windows.msi`
            - **校验**：`SHA256SUMS`（minisign 签名由维护者离线生成后补充 `SHA256SUMS.minisig`，公钥见仓库根 `minisign.pub`）
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
