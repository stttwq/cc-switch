[package]
name = "cc-switch"
version = "2.3.0"
description = "The All-in-One Manager for Claude Code, Codex & Pi"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/stttwq/cc-switch"
edition = "2021"
rust-version = "1.85.0"
# 现含两个 bin（GUI 主程序 `cc-switch` + P1 控制台 shim `ccs`）；显式指定默认运行主程序，
# 否则 `cargo run` / `tauri dev` 会因"无法确定要跑哪个 bin"报错。
default-run = "cc-switch"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

# 2.2 方案 P1：控制台 shim 子二进制 `ccs env <app>`。
# 独立于 GUI 主程序（无 windows_subsystem、有 stdout、不受 single-instance 影响），
# 仅解析 args + 调 cc_switch_lib::cli + 按退出码 exit。
[[bin]]
name = "ccs"
path = "src/bin/ccs.rs"

# 资源管理器右键菜单专用启动器。windows_subsystem="windows"（无控制台），
# 避免从资源管理器启动时闪现控制台窗口；只调 cc_switch_lib::cli::run_open_command。
[[bin]]
name = "ccs-open"
path = "src/bin/ccs_open.rs"

[features]
default = []
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "socks", "http2", "charset"] }
arboard = "3.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
regex = "1.10"
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
sys-locale = "0.3"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
zeroize = "1"
async-trait = "0.1"
# 2.1 方案 P3：同步端到端加密（附录 B；nonce/salt/DEK 随机数用 rand_core，不另引 rand）
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Optimize release binary size for the Windows MSI
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
futures = "0.3"

# T-7 集成测试需在 Windows 上把 live 文件设为只读（std 的 Permissions 无 setter）。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
