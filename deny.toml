# cargo-deny 配置 —— 依赖漏洞、许可证与重复/来源治理。
# 由 .github/workflows/audit.yml 调用。按方案 D3：advisories 阻塞，licenses/bans 只报告。
# 任何 ignore 都必须写理由；上游插件偶发公告可临时按 ID 豁免。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
db-path = "~/.cargo/advisory-dbs"
git-fetch-with-cli = true
# 未使用的依赖命中公告时降级（只对本仓库真正编译进去的才严格）
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # 例：{ id = "RUSTSEC-0000-0000", reason = "上游 Tauri 插件传递依赖，等待其升级" }
]

[licenses]
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "MIT-0",
    "Python-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed63 }]

[bans]
multiple-versions = "warn"   # reqwest 双版本等是治理问题，只报告（见方案 S-8）
wildcards = "allow"
highlight = "all"
deny = [
    # 明确拉黑的 crate 写在这里
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
